name: Test React Application

on: 
  push:
    branches:
    - trunk

jobs:
 build:
   runs-on: macos-latest
   strategy:
     matrix:
       node-version: [22.x]

   steps:
     - name: Checkout repository
       uses: actions/checkout@v4
     - name: Use Node.js ${{ matrix.node-version }}
       uses: actions/setup-node@v2
       with:
         node-version: ${{ matrix.node-version }}
     - name: Unit checks
       run: |
         npm ci
         npm test